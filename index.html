<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush Game Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: #1e293b;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            z-index: 10;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #38bdf8;
        }
        .status {
            font-size: 0.875rem;
            color: #4ade80;
            background: #0f172a;
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid #334155;
        }
        .game-wrapper {
            flex: 1;
            width: 100%;
            height: calc(100vh - 57px);
            background: #020617;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ayush Game Hub</h1>
        <div class="status">🟢 Secure Edge Proxy Active</div>
    </header>

    <div class="game-wrapper">
        <iframe src="https://rocketgoal.io" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
    </div>

</body>
</html>
