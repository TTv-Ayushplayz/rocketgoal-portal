<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush Game Hub | Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #090d16;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: #111827;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
            z-index: 10;
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-actions {
            display: flex;
            gap: 10px;
        }
        button {
            background: #1f2937;
            color: #f8fafc;
            border: 1px solid #374151;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #374151;
            border-color: #4b5563;
        }
        button.active {
            background: #0284c7;
            border-color: #38bdf8;
        }
        .viewport {
            flex: 1;
            width: 100%;
            height: calc(100vh - 53px);
            position: relative;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .fallback-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .scoreboard {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #f8fafc;
            letter-spacing: 2px;
        }
        canvas {
            background: #030712;
            border: 3px solid #374151;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
            max-height: 68vh;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1><span>🚀</span> Ayush Game Hub</h1>
        <div class="nav-actions">
            <button id="btnMain" class="active" onclick="switchMode('iframe')">Official Node</button>
            <button id="btnFallback" onclick="switchMode('local')">Stealth Arena</button>
            <button onclick="toggleFullscreen()">Fullscreen</button>
        </div>
    </header>

    <div class="viewport">
        <!-- Official Game Frame (Blocked at school) -->
        <iframe id="gameFrame" src="https://rocketgoal.io" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>

        <!-- Playable Stealth Arcade Arena (Unblocked local game) -->
        <div id="localFallback" class="fallback-screen">
            <div class="scoreboard" id="scoreboard">BLUE 0 - 0 RED</div>
            <canvas id="gameCanvas" width="900" height="500"></canvas>
            <div class="controls-hint">Use <b>W / S</b> or <b>▲ / ▼</b> to Drive &amp; Defend!</div>
        </div>
    </div>

    <script>
        function switchMode(mode) {
            const iframe = document.getElementById('gameFrame');
            const fallback = document.getElementById('localFallback');
            const btnMain = document.getElementById('btnMain');
            const btnFallback = document.getElementById('btnFallback');

            if (mode === 'iframe') {
                iframe.style.display = 'block';
                fallback.style.display = 'none';
                btnMain.classList.add('active');
                btnFallback.classList.remove('active');
            } else {
                iframe.style.display = 'none';
                fallback.style.display = 'flex';
                btnFallback.classList.add('active');
                btnMain.classList.remove('active');
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Stealth Arena Game Engine
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let car = { x: 100, y: 225, width: 45, height: 24, speed: 6, color: '#38bdf8' };
        let aiCar = { x: 755, y: 225, width: 45, height: 24, speed: 4.5, color: '#f43f5e' };
        let ball = { x: 450, y: 250, radius: 14, dx: 5, dy: 3, color: '#fbbf24' };
        let score = { player: 0, ai: 0 };
        let keys = {};

        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if(['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        function update() {
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && car.y > 10) car.y -= car.speed;
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && car.y < canvas.height - car.height - 10) car.y += car.speed;

            if (aiCar.y + aiCar.height / 2 < ball.y && aiCar.y < canvas.height - aiCar.height - 10) aiCar.y += aiCar.speed;
            if (aiCar.y + aiCar.height / 2 > ball.y && aiCar.y > 10) aiCar.y -= aiCar.speed;

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) ball.dy *= -1;

            if (ball.x - ball.radius < car.x + car.width && ball.y > car.y && ball.y < car.y + car.height && ball.x > car.x) {
                ball.dx = Math.abs(ball.dx) * 1.05;
                ball.dy += (Math.random() - 0.5) * 2;
            }

            if (ball.x + ball.radius > aiCar.x && ball.y > aiCar.y && ball.y < aiCar.y + aiCar.height && ball.x < aiCar.x + aiCar.width) {
                ball.dx = -Math.abs(ball.dx) * 1.05;
                ball.dy += (Math.random() - 0.5) * 2;
            }

            ball.dx = Math.max(Math.min(ball.dx, 12), -12);
            ball.dy = Math.max(Math.min(ball.dy, 10), -10);

            if (ball.x < 0) {
                score.ai++;
                updateScoreboard();
                resetBall(-1);
            } else if (ball.x > canvas.width) {
                score.player++;
                updateScoreboard();
                resetBall(1);
            }
        }

        function resetBall(dir) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = dir * 5;
            ball.dy = (Math.random() - 0.5) * 4;
        }

        function updateScoreboard() {
            document.getElementById('scoreboard').innerText = `BLUE ${score.player} - ${score.ai} RED`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 70, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, canvas.height / 2 - 70, 10, 140);
            ctx.fillRect(canvas.width - 10, canvas.height / 2 - 70, 10, 140);

            ctx.fillStyle = car.color;
            ctx.fillRect(car.x, car.y, car.width, car.height);

            ctx.fillStyle = aiCar.color;
            ctx.fillRect(aiCar.x, aiCar.y, aiCar.width, aiCar.height);

            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
